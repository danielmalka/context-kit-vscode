# Copy to .github/workflows/ci.yml in your project.
# Adjust the Node version and package manager (npm/pnpm) as needed.
# Requires typescript/verifications/Makefile copied to the project root (check-strict target).
# eslint/typescript/prettier/vitest (+ @vitest/coverage-v8) must be devDependencies in
# the project's package.json — `npm ci` installs them from package-lock.json below.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: make check-strict
